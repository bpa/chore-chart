[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "family-chore-chart"
version = "0.1.0"
description = "Generate fair, constraint-based family chore charts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "ortools>=9.12",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=chore_chart --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
source = ["chore_chart"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75